<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Brawl Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
                 background: #070b1a; color: #cfd6e6; font-family: Poppins, "Segoe UI", Arial, sans-serif; }
    /* the game takes the whole window (Phaser RESIZE mode makes the canvas fill it) */
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }
    #help { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
            font-size: 11.5px; line-height: 1.55; text-align: center; padding: 7px 16px; color: #b9c6ee;
            background: rgba(8,12,30,0.62); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; }
    #help.hidden { display: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="help"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    // TURN relay (Metered) so players on strict networks (mobile data etc.) can still connect.
    window.PEER_OPTIONS = { config: { iceServers: [
      { urls: 'stun:stun.relay.metered.ca:80' },
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'turn:global.relay.metered.ca:80', username: '3c14edd958e7e96303c0792c', credential: 'd3Tn732FzWSlmVmX' },
      { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: '3c14edd958e7e96303c0792c', credential: 'd3Tn732FzWSlmVmX' },
      { urls: 'turn:global.relay.metered.ca:443', username: '3c14edd958e7e96303c0792c', credential: 'd3Tn732FzWSlmVmX' },
      { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: '3c14edd958e7e96303c0792c', credential: 'd3Tn732FzWSlmVmX' }
    ] } };
  </script>
  <script src="music.js"></script>
  <script src="juice.js"></script>
  <script src="controls.js"></script>
  <script src="moves.js"></script>
  <script src="weapons.js"></script>
  <script src="characters.js"></script>
  <script src="charart.js"></script>
  <script src="ui.js"></script>
  <script src="menu.js"></script>
  <script src="lobby.js"></script>
  <script src="settings.js"></script>
  <script src="net.js"></script>
  <script src="online.js"></script>
  <script src="bot.js"></script>
  <script src="tutorial.js"></script>
  <script src="game.js"></script>
  <script>
    // Hide the controls text in the Menu; show it only in the game
    window.setHelpVisible = (v) => { document.getElementById('help').style.display = v ? '' : 'none'; };
    // The controls text at the bottom of the game always shows the CURRENT bindings from Settings
    window.refreshHelp = () => {
      const L = (pid, a) => Controls.label(pid, a);
      const two = SELECTION.mode === 'friends';
      let t = `P1 - Move: ${L('p1','left')} / ${L('p1','right')} &nbsp;|&nbsp; Up / Down: ${L('p1','up')} / ${L('p1','down')} &nbsp;|&nbsp; Jump: ${L('p1','jump')} &nbsp;|&nbsp; Dash: ${L('p1','dodge')}<br>` +
        `Light: ${L('p1','light')} &nbsp;|&nbsp; Heavy: ${L('p1','heavy')} &nbsp;|&nbsp; Pick up / Throw (hold a direction to aim): ${L('p1','throw')}<br>`;
      if (two) t += `P2 - Move: ${L('p2','left')} / ${L('p2','right')} &nbsp;|&nbsp; Jump: ${L('p2','jump')} &nbsp;|&nbsp; Dash: ${L('p2','dodge')} &nbsp;|&nbsp; Light: ${L('p2','light')} &nbsp;|&nbsp; Heavy: ${L('p2','heavy')} &nbsp;|&nbsp; Pick up / Throw: ${L('p2','throw')}<br>`;
      t += 'F = fullscreen &nbsp;|&nbsp; H = show/hide this text &nbsp;|&nbsp; B = show/hide hitboxes &nbsp;|&nbsp; ESC = back to Lobby (Bot / Tutorial)';
      document.getElementById('help').innerHTML = t;
    };
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') document.getElementById('help').classList.toggle('hidden');
    });
  </script>
</body>
</html>
